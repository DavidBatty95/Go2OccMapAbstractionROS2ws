name: Go2 simulation verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: go2-sim-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulation:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation and Compose
        run: |
          python3 scripts/check_docs.py
          docker compose config --quiet
          bash -n go2 docker/entrypoint.sh
      - name: Download verified public assets and build ROS workspace
        run: ./go2 setup
      - name: Geometry, policy and physics tests
        run: ./go2 test
      - name: Closed-loop ROS and physical return check
        run: ./go2 demo --world partitioned --duration 120 --speed 2 --seed 1 --require-return
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go2-simulation-evidence
          path: results/
          retention-days: 14
